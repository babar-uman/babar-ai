<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Babar AI Command Executor Test</title>
</head>

<body>

  <h1>Babar AI Command Executor Test</h1>

  <pre id="output">Testing...</pre>


  <script src="./babar-core.js"></script>
  <script src="./permission-manager.js"></script>
  <script src="./command-router.js"></script>
  <script src="./command-executor.js"></script>
  <script src="../skills/skill-manager.js"></script>


  <script>

    const output =
      document.getElementById("output");


    try {

      // Core
      const core =
        new BabarCore({
          name: "Babar AI",
          version: "0.1.0"
        });


      // Permission Manager
      const permissionManager =
        new PermissionManager();


      permissionManager.setPermission(
        "skill.demo",
        "ask"
      );


      // Skill Manager
      const skillManager =
        new SkillManager();


      skillManager.register(
        "demo",
        {

          version: "1.0.0",

          description:
            "Demo skill for Command Executor testing.",

          category:
            "test",

          permissions:
            [],

          execute:
            async (command) => {

              return {

                message:
                  "Demo skill executed successfully.",

                received:
                  command.parameters

              };

            }

        }
      );


      // Router
      const router =
        new CommandRouter(
          core,
          skillManager,
          permissionManager
        );


      // Executor
      const executor =
        new CommandExecutor(
          router
        );


      // Command
      const command =
        core.createCommand(
          "skill",
          "execute",
          "demo",
          {

            message:
              "Hello from Babar AI Executor"

          }
        );


      // Execute WITHOUT confirmation
      executor.execute(
        command,
        false
      ).then(
        (blockedResult) => {


          // Execute WITH confirmation
          executor.execute(
            command,
            true
          ).then(
            (successResult) => {


              output.textContent =
                JSON.stringify(
                  {

                    status:
                      "PASS",

                    executor:
                      executor.getStatus(),

                    blocked:
                      blockedResult,

                    successful:
                      successResult,

                    history:
                      executor.getHistory()

                  },
                  null,
                  2
                );

            }
          );

        }
      );


    } catch (error) {

      output.textContent =
        JSON.stringify(
          {

            status:
              "FAIL",

            error:
              error.message

          },
          null,
          2
        );

    }

  </script>

</body>

</html>
