<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Execution Logger Test</title>

</head>

<body>

  <h1>Execution Logger Test</h1>

  <pre id="result">Testing...</pre>


  <script>

    const result =
      document.getElementById("result");


    const script =
      document.createElement("script");


    script.src =
      "./execution-logger.js?v=" +
      Date.now();


    script.onload = function () {

      if (
        typeof window.ExecutionLogger ===
        "function"
      ) {

        try {

          const logger =
            new window.ExecutionLogger();


          const log =
            logger.log({

              command_id:
                "test-001",

              type:
                "system",

              action:
                "test",

              target:
                "logger",

              success:
                true,

              permission_required:
                false,

              message:
                "Logger loaded successfully."

            });


          result.textContent =
            JSON.stringify(

              {

                status: "PASS",

                script_loaded: true,

                logger_available: true,

                log: log,

                status_info:
                  logger.getStatus(),

                logs:
                  logger.getLogs()

              },

              null,

              2

            );

        }

        catch (error) {

          result.textContent =
            "FAIL\n\n" +
            "Logger loaded, but execution failed:\n\n" +
            error.message;

        }

      }

      else {

        result.textContent =
          "FAIL\n\n" +
          "Script loaded, but ExecutionLogger was not exported.";

      }

    };


    script.onerror = function () {

      result.textContent =
        "FAIL\n\n" +
        "execution-logger.js could not be loaded.";

    };


    document.head.appendChild(script);

  </script>

</body>

</html>
