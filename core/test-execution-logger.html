<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Execution Logger Test</title>

</head>


<body>

  <h1>Execution Logger Test</h1>

  <pre id="result">Testing...</pre>


  <script src="./execution-logger.js"></script>


  <script>

    try {

      if (
        typeof ExecutionLogger === "undefined"
      ) {

        throw new Error(
          "ExecutionLogger failed to load."
        );

      }


      const logger =
        new ExecutionLogger();


      const logResult =
        logger.log({

          command_id:
            "test-command-001",

          type:
            "system",

          action:
            "test",

          target:
            "logger",

          success:
            true,

          permission_required:
            false,

          message:
            "Execution Logger test successful."

        });


      const status =
        logger.getStatus();


      const logs =
        logger.getLogs();


      const passed =
        logResult.success === true &&
        status.total_logs === 1 &&
        logs.length === 1;


      document.getElementById(
        "result"
      ).textContent =

        JSON.stringify(

          {

            status:
              passed
                ? "PASS"
                : "FAIL",

            logger_status:
              status,

            log_result:
              logResult,

            logs:
              logs

          },

          null,

          2

        );


    }

    catch (error) {

      document.getElementById(
        "result"
      ).textContent =

        "FAIL\n\n" +
        error.message;

    }

  </script>

</body>

</html>
