<!DOCTYPE html>
<html>
<head>
  <title>Execution Logger Test</title>
</head>

<body>

<h1>Execution Logger Test</h1>

<div id="result">Testing...</div>

<script src="execution-logger.js"></script>

<script>

try {

  const logger = new ExecutionLogger();

  const result = logger.log({

    command_id: "test-001",

    type: "system",

    action: "test",

    target: "logger",

    success: true,

    permission_required: false,

    message: "Logger test successful."

  });


  document.getElementById("result").innerText =
    JSON.stringify(
      {
        status: "PASS",
        result: result,
        total_logs: logger.getStatus().total_logs
      },
      null,
      2
    );


} catch (error) {

  document.getElementById("result").innerText =
    "FAIL\n\n" + error.message;

}

</script>

</body>
</html>
