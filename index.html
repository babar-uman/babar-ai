<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Studio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>My AI Studio</h1>
    <div class="status">● Free</div>
  </header>

  <main class="container">

    <section class="hero">
      <h2>What do you want to create?</h2>
      <p>Describe your idea and start building your project.</p>
    </section>

    <section class="card">

      <textarea
        id="prompt"
        placeholder="Describe what you want to create..."></textarea>

      <button onclick="generateIdea()">
        Generate
      </button>

      <div id="output">
        Your result will appear here...
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
