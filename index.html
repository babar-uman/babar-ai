<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Studio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>My AI Studio</h1>
  </header>

  <div class="container">

    <div class="card">

      <textarea
        id="prompt"
        placeholder="Describe what you want to create..."></textarea>

      <button onclick="generateIdea()">
        Generate
      </button>

      <div id="output">
        Your result will appear here...
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
