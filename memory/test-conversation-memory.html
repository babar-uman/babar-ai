<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Conversation Memory Test</title>

</head>


<body>

  <h1>Conversation Memory Test</h1>

  <pre id="output">Testing...</pre>


  <script src="short-term-memory.js?v=3"></script>

  <script src="long-term-memory.js?v=3"></script>

  <script src="memory-manager.js?v=3"></script>

  <script src="conversation-memory.js?v=2"></script>


  <script>

    const output =
      document.getElementById(
        "output"
      );


    try {

      /*
       * Check required classes
       */

      if (
        typeof ShortTermMemory !==
        "function"
      ) {

        throw new Error(
          "ShortTermMemory is not loaded."
        );

      }


      if (
        typeof LongTermMemory !==
        "function"
      ) {

        throw new Error(
          "LongTermMemory is not loaded."
        );

      }


      if (
        typeof MemoryManager !==
        "function"
      ) {

        throw new Error(
          "MemoryManager is not loaded."
        );

      }


      if (
        typeof ConversationMemory !==
        "function"
      ) {

        throw new Error(
          "ConversationMemory is not loaded."
        );

      }


      /*
       * Create memory layers
       */

      const shortTerm =
        new ShortTermMemory(20);


      const longTerm =
        new LongTermMemory(
          "babar-ai-conversation-test-v2"
        );


      longTerm.clear();


      const manager =
        new MemoryManager(
          shortTerm,
          longTerm
        );


      const conversation =
        new ConversationMemory(
          manager
        );


      /*
       * Record conversation
       */

      const userMessage =
        conversation.recordUserMessage(
          "My name is Babar."
        );


      const assistantMessage =
        conversation.recordAssistantMessage(
          "Nice to meet you, Babar."
        );


      const systemMessage =
        conversation.recordSystemMessage(
          "Conversation started."
        );


      /*
       * Get recent context
       */

      const context =
        conversation.getRecentContext(
          10
        );


      /*
       * Long-term memory
       */

      const remember =
        conversation.rememberImportant(
          "user_name",
          "Babar",
          "personal"
        );


      const recall =
        conversation.recallImportant(
          "user_name"
        );


      const search =
        conversation.searchImportant(
          "Babar"
        );


      /*
       * Test active state
       */

      const activeBefore =
        conversation.isActive();


      conversation.setActive(
        false
      );


      const blockedMessage =
        conversation.recordUserMessage(
          "This message should be blocked."
        );


      const inactiveState =
        conversation.isActive();


      conversation.setActive(
        true
      );


      const activeAfter =
        conversation.isActive();


      /*
       * Status
       */

      const status =
        conversation.getStatus();


      /*
       * Final validation
       */

      const passed =

        userMessage.success === true &&

        assistantMessage.success === true &&

        systemMessage.success === true &&

        context.length === 3 &&

        remember.success === true &&

        recall !== null &&

        recall.value === "Babar" &&

        search.length === 1 &&

        activeBefore === true &&

        blockedMessage.success === false &&

        inactiveState === false &&

        activeAfter === true &&

        status.active === true &&

        status.memory_manager_connected === true &&

        status.recent_context_count === 3;


      if (!passed) {

        throw new Error(
          "Conversation Memory validation failed."
        );

      }


      /*
       * Show successful result
       */

      output.textContent =

        "✅ PASS\n\n" +

        JSON.stringify(

          {

            user_message:
              userMessage,

            assistant_message:
              assistantMessage,

            system_message:
              systemMessage,

            recent_context:
              context,

            remembered:
              remember,

            recalled:
              recall,

            search:
              search,

            active_before:
              activeBefore,

            blocked_message:
              blockedMessage,

            inactive_state:
              inactiveState,

            active_after:
              activeAfter,

            status:
              status

          },

          null,

          2

        );


    }

    catch (error) {

      output.textContent =

        "❌ ERROR\n\n" +

        error.message;

    }

  </script>

</body>

</html>
